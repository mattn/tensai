name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.26.x", "1.27.x"]
        goexperiment: ["", "simd"]
        # macos-latest is Apple Silicon: the one runner that executes the
        # NEON kernels natively rather than under emulation. Windows runs
        # the OS-specific files (mmap, memory queries, the cache root) that
        # a cross-compile only type-checks.
        include:
          - os: macos-latest
            go: "1.27.x"
            goexperiment: "simd"
          - os: windows-latest
            go: "1.27.x"
            goexperiment: "simd"
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false # no dependencies, no go.sum
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: |
          go test ./...
          go test ./_example/tinygpt
      # A kernel's worth is a number, and the numbers hardest to come by
      # are the ones no desk here can take: the macOS runner is this
      # project's only arm64 machine, and emulation answers instruction
      # counts rather than speed. So the compute benchmarks run on every
      # runner and leave their numbers in the log, where a change that
      # claims a speedup can be read against the build before it and the
      # portable job can be read against the vectorized one. Only the
      # packages that need nothing but a CPU, which is about fifteen
      # seconds of them; a shared runner is too noisy for small
      # differences, and nothing here gates on the result.
      - name: bench
        run: go test -run '^$' -bench . -benchtime 100ms ./internal/kernels ./quant .
      - name: examples build
        run: |
          for d in _example/*/; do
            go build -o /dev/null "./$d"
          done
