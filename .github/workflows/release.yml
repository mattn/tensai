name: Release

on:
  push:
    tags:
    - 'v*'

jobs:
  # A tag that does not match the version embedded in cmd/tensai (e.g. a
  # module-retraction tag) must not publish binaries or move the image tags.
  check:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      match: ${{ steps.v.outputs.match }}
    steps:
    - uses: actions/checkout@v4
    - id: v
      run: |
        # Mirrors "make show-version" without a Go toolchain.
        want="v$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/tensai/main.go)"
        echo "tag=$GITHUB_REF_NAME embedded=$want"
        if [ "$want" = "$GITHUB_REF_NAME" ]; then
          echo match=true >> "$GITHUB_OUTPUT"
        else
          echo match=false >> "$GITHUB_OUTPUT"
        fi

  release:
    name: Release
    needs: check
    if: needs.check.outputs.match == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.27.x"
        cache: false
    - name: Cross build
      run: make cross
    - name: Upload
      run: make upload
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker
    needs: check
    if: needs.check.outputs.match == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: |
          REVISION=${{ github.sha }}
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.ref_name }}
